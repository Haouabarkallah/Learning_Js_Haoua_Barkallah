<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Shopping Cart</title>
</head>
<body>
    <!-- navBar -->
    <nav>
        <!-- top nav bar -->
        <div class="navbar-top">
            <button id="menuButton">Menu</button>
             <!-- logo -->
            <h2 class="logo">Fruit Shop</h2>

            <div class="account">
                <button id="accountButton">Account</button> <!-- icon -->
                <span class="account-text">My account</span>
            </div>
            <!-- shopping cart -->
             <div class="shopping-cart">
                <div class="sum-prices">
                    <!-- shopping cart logo -->
                    <span class="cart-logo">🛒</span>  <!-- icon -->
                    <!-- the total prices of the products in the shopping cart -->
                     <h6 id="sum-prices"></h6>
                </div>
             </div>
        </div>
        <!-- navbar bottom part -->
         <div class="navbar" id="navbar">
            <div class="links">
                <ul>
                    <li class="nav-links"><a href="#">Home</a></li>
                    <li class="nav-links"><a href="#">Products</a></li>
                    <li class="nav-links"><a href="#">About</a></li>
                    <li class="nav-links"><a href="#">Contact</a></li>
                </ul>
            </div>
            
            <!-- the search bar -->
            <div class="search-bar">
                <form action="#" method="get">
                    <input type="search" placeholder="Search...">
                    <button id="searchButton">Search</button> <!-- icon -->
                </form>
            </div>
        </div>
        <div class="productOnCart hide">
            <!-- Product items will be displayed here -->
             <div class="overlay">

             </div>
             <div class="top">
                <button id="closeButton">✕
                    <!-- icon -->
                </button>
                <h3> Cart</h3>
             </div>
             <ul id="buyItems">
                <h4 class="empty-cart"> Your shopping cart is empty</h4>
             </ul>
             <button class="checkoutButton">Check out</button>
        </div>

    </nav>

    <header id="headerSlide">
        <div class="ms-content">
            <a href="">
                <img src="" alt="">
            </a>
            <a href="#" class="item">
                    <img src="Images/Other/slide2.jpg" />
            </a>
            <a href="detail_page.html" class="item">
                    <img src="Images/Other/slide3.jpg" />
            </a>
            <a href="detail_page.html" class="item">
                    <img src="Images/Other/Iphone 12.png" />
            </a>
            <a href="detail_page.html" class="item">
                    <img src="Images/Other/slide5.jpg" />
            </a>
        </div>
        <div class="ms-controls">
            <button class="ms-right">
                <!-- icon -->
            </button>
            <button class="ms-left">Next
                <!-- icon -->
            </button>
        </div>
    </header>
    <main>
        <section class="main-section">
            <div class="product-contenair">
                <h3>Popular fruits</h3>
                <div class="products">
                    <div class="product">
                        <div class="product-under">
                            <figure class="product-image">
                                <img src="Image/banane.png" alt="Banana">
                                <div class="product-over">
                                    <button class=" btn-small addToCart" data-product-id="1"> <!-- icon -->Add to Cart</button>
                                   <a href="detail_page.html" class="btn btn-small">More Info</a> 
                                </div>
                            </figure>
                            <div class="product-summary">
                                <h4 class="product-name">Product 1</h4>
                                <span class="stars"></span>
                                <P> BANANA DEScription</P>
                                <h6 class="price">
                                    <span>500</span> FCFA
                                </h6>
                            </div>
                        </div>
                    </div>
                    <div class="product">
                        <div class="product-under">
                            <figure class="product-image">
                                <img src="Image/banane.png" alt="Banana">
                                <div class="product-over">
                                    <button class=" btn-small addToCart" data-product-id="2"> <!-- icon -->Add to Cart</button>
                                   <a href="detail_page.html" class="btn btn-small">More Info</a> 
                                </div>
                            </figure>
                            <div class="product-summary">
                                <h4 class="product-name">Product 2</h4>
                                <span class="stars"></span>
                                <P> BANANA DEScription</P>
                                <h6 class="price">
                                    <span>500</span> FCFA
                                </h6>
                            </div>
                        </div>
                </div>
            </div>
        </section>
        
    </main>
    <script src="script.js" defer></script>
    
</body>
</html>
