<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Shopping Cart</title>
</head>
<body>
    <!-- navBar -->
    <nav>
        <!-- top nav bar -->
        <div class="navbar-top">
            <button id="menuButton">Menu</button>
             <!-- logo -->
            <h2 class="logo">Fruit Shop</h2>

            <div class="account">
                <button id="accountButton">Account</button> <!-- icon -->
                <span class="account-text">My account</span>
            </div>
            <!-- shopping cart -->
             <div class="shopping-cart">
                <div class="sum-prices">
                    <!-- shopping cart logo -->
                    <span class="cart-logo">🛒</span>  <!-- icon -->
                    <!-- the total prices of the products in the shopping cart -->
                     <h6 id="sum-prices"></h6>
                </div>
             </div>
        </div>
    </nav>

    <script src="script.js" defer></script>
    
</body>
</html>
