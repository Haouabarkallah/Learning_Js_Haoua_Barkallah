<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary Component</title>
  <link rel="shortcut icon" href="./images/favicon-32x32 (2).png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card-container">
    <div class="card">
      <!-- Image d'en-tête -->
      <div class="card-hero">
        <img src="./images/illustration-hero (2).svg" alt="Illustration de musique">
      </div>

      <!-- Contenu principal -->
      <div class="card-body">
        <h1 class="title">Order Summary</h1>
        <p class="description">
          You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
        </p>

        <!-- Plan d'abonnement -->
        <div class="plan-box">
          <div class="plan-details">
            <div class="music-icon">
              
              <img src="./images/icon-music (3).svg" alt="Icon-music">

            </div>
            <div class="plan-text">
              <h2>Annual Plan</h2>
              <p>$59.99/year</p>
            </div>
          </div>
          <a href="#" class="change-btn">Change</a>
        </div>

        <!-- Actions -->
        <button class="btn-primary">Proceed to Payment</button>
        <button class="btn-secondary">Cancel Order</button>
      </div>
    </div>
  </main>

</body>
</html>
