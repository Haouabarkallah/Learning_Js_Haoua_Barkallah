<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mon Blog </title>

</head>
<body>
    
    <header class="entete">
        <h1>Bloggy</h1>
        <p>Articles sur le developpement web</p>
    </header>

    <main class="container">
        <section class="bare-outils">
            <input type="text" name="" id="recherche" placeholder="Rechercher un article..." autocomplete="off">
            <section id="filtre-categorie">
                <option value="">Toutes les catégories</option>
                <!-- rempli dynamiquement en js -->
            </section>
            <section id="tri">
                <option value="recent">Plus récents</option>
                <option value="ancien">Plus anciens</option>
            </section>
        </section>
        <!-- message d'etat (chargement , erreur, aucun resultat)
         -->
        <p id="message-etat"></p>
        <!-- grille des articles -->
         <section id="grille-articles" class="grille-articles"></section>
    </main>
    <!-- modale pour affichier le details d'un article -->
    <div id="modale" class="modale masquee">
        <div class="contenu-modale">
            <button id="fermer-modale" class="bouton-fermer"> ferme</button>
            <div id="detail-article"></div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
