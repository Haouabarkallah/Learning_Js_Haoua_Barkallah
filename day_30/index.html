<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    <title>Task Scheduler</title>
</head>
<body>

    <div class="container">
        <!-- // adding a title and description -->
        <header>
            <h1>Task scheduler</h1>
            <p>Orrganize your tasks effeciently and boost your productivity</p>

        </header>

        <div class="app-container">
            <div class="left-panel">
                <div class="card">
                   <h2>Add New Task</h2>
                   <form action="" class="task-form" id="taskform">
                        <div class="form-group">
                            <label for="taskTitle">Task Title</label>
                            <input type="text" id="taskTitle" placeholder="What you needs to be done?" required>

                        </div>
                        <div class="form-group">
                            <label for="taskDescription">Description</label>
                            <textarea name="" id="taskDescription" placeholder="Add details about your task..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="taskDueDate">Due Date</label>
                            <input type="date" id="taskDueDate">
                        </div>
                        <div class="form-group">
                            <label for="taskPriority">Priority</label>
                            <select name="" id="taskPriority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <button type="submit">Add Task</button>
                   </form>
                </div>

                <div class="card">
                    <h2>Task Statistics</h2>
                    <div class="stats">
                        <div class="stat-card">
                            <h3 id="totalTasks">0</h3>
                            <p>Total Tasks</p>
                        </div>
                        <div class="stat-card">
                            <h3 id="completedTasks">0</h3>
                            <p>Completed</p>
                        </div>
                        <div class="stat-card">
                            <h3 id="pendingTasks">0</h3>
                            <p>Pending</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="right-panel">
                <div class="card">
                    <h2> Your Tasks</h2>
                    
                </div>
            </div>
        </div>

    </div>
    <script src="script.js" defer></script>
    
</body>
</html>
