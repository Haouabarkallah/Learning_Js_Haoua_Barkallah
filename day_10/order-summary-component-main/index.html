<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32 (1).png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main class="container">
    <img src="./images/illustration-hero (1).svg" alt="illustration-hero" class="illustration-hero">
    <h1> Order Summary</h1>
    <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
    device anywhere you like!</p>

   <section class="plan"> 
      <img src="./images/icon-music (1).svg" alt="icon-music">
      <span class="annual">Annual Plan</span>
      
      <span class="total"> $59.99/year </span>
      <a href="#">Change</a>
   </section>
  
    <div class="button">
      <span class="payment"><a href="#">Proceed to Payment</a></span>
      <span class="cancel-order"><a href="#">Cancel Order</a></span>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
