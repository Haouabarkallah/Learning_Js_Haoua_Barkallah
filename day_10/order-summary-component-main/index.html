<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32 (1).png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->
</head>
<body>

  <main class="container">
    <img src="./images/illustration-hero (1).svg" alt="illustration-hero" class="illustration-hero">
    <h1> Order Summary</h1>
      <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
      device anywhere you like!</p>

      <div class="plan"> 
        <div  class="plan-details">
          <img src="./images/icon-music (1).svg" alt="icon-music">
          <div class="plan-txt">
            <h2>Annual Plan</h2>
            <p>$59.99/year </p>
            
          </div>
        </div>
        <a href="#">Change</a>
      </div>
    
      
      <button class="payment">Proceed to Payment</button>
      <button class="cancel-order">Cancel Order</button>
  </main>

    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
