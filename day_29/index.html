<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"><script src="https://kit.fontawesome.com/3ff77786d1.js" crossorigin="anonymous"></script>

    <title>Address Book</title>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1><i class="fa fa-address-book" aria-hidden="true"></i> My Address Book</h1>
        </div>
        <div class="quickadd">
            <button id="QuickAdd">Add</button>
        </div>
        <div class="quickaddForm">
            <label for="fullname"> Name</label>
            <input type="text" id="fullname" class="formFields">
            <label for="phone">Phone</label>
            <input type="text" id="phone" class="formFields">
            <label for="address">Address</label>
            <textarea name="address" id="address" cols="30" rows="10" class="formFields"></textarea>
            <label for="city">City</label>
            <input type="text" id="city" class="formFields">
            <label for="email">E-Mail</label>
            <input type="text" id="email" class="formFields">
            <br>
            <button id="Add">Add Now</button>
            <button id="Cancel">Cancel</button>
        </div>
        <div class="addbook">
            <div class="entry">
                <div class="name">
                    <p> Hala</p>
                </div>
                <div class="email">
                    <p>hala@gmail.com</p>
                </div>
                <div class="phone">
                    <p>699076543</p>
                </div>
                <div class="address">
                    <p>Manguier</p>
                </div>
                <div class="city">
                    <p>Yaoundé</p>
                </div>
                <div class="del">
                    <a href="#"> Delete</a>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
