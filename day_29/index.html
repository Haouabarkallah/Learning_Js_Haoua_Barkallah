<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Address Book</title>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>My Address Book</h1>
        </div>
        <div class="quickadd">
            <button id="QuickAdd">Add</button>
        </div>
        <div class="quickaddForm">
            <label for="fullname"> Name</label>
            <input type="text" id="fullname" class="formFields">
            <label for="phone">Phone</label>
            <input type="text" id="phone" class="formFields">
            <label for="address">Address</label>
            <textarea name="address" id="address" cols="30" rows="10" class="formFields"></textarea>
            <label for="city">City</label>
            <input type="text" id="city" class="formFields">
            <label for="email">E-Mail</label>
            <input type="text" id="email" class="formFields">
            <br>
            <button id="Add">Add Now</button>
            <button id="Cancel">Cancel</button>
        </div>
        
    </div>
    <script src="script.js" defer></script>
</body>
</html>
